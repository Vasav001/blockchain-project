# Serves the built React app and reverse-proxies /api/* to the backend
# Compose service, so the browser only ever talks to one origin (this one)
# and never needs CORS configuration or a hardcoded backend host/IP.
#
# `backend` below is the Docker Compose service name for the Rust API -
# resolvable via Compose's internal DNS *from inside this nginx container*.
# That's different from (and doesn't conflict with) the requirement that
# the browser never see a Docker-internal hostname: the browser only ever
# talks to this nginx server; this container is the one making the
# internal `backend` connection, server-side, on the browser's behalf.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    location = /health {
        proxy_pass http://backend:8080/health;
    }

    # SPA fallback: serve index.html for any route that isn't a real static
    # file, so a client-side router (none exists yet, but this is the
    # standard safe default) wouldn't 404 on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
